<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InsureDrive — check, renew and compare vehicle insurance</title>
<meta name="description" content="Check, renew and compare vehicle insurance with interactive number plate scanning and policy comparison.">
<meta property="og:title" content="InsureDrive — check, renew and compare vehicle insurance">
<meta property="og:description" content="Check, renew and compare vehicle insurance with interactive number plate scanning and policy comparison.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=Space+Grotesk:wght@600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Urbanist:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --screen:#0b1e3f; --bg:#081833; --card:#10264d; --card2:#0d2043; --line:rgba(255,255,255,.1);
  --txt:#eaf1ff; --mut:#9fb3d6; --amber:#ffb23e; --amber2:#ff8a1f; --ok:#31d0a0; --bad:#ff6b6b; --blue:#4db2ff;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:#378FF5;color:#202124;font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body.intro-on{overflow:hidden;height:100%;background:var(--screen);color:var(--txt)}
button{font:inherit;cursor:pointer}
a{color:inherit}

/* ================= INTRO ================= */
#intro{position:fixed;inset:0;z-index:50;background:#120c09;overflow:hidden;transition:opacity .7s ease}
#intro.out{opacity:0;pointer-events:none}
#stage{position:absolute;container-type:size;transition:transform 1.5s cubic-bezier(.65,0,.25,1);will-change:transform;background:#120c09}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
#v1{z-index:1}
#v2{z-index:0;opacity:.001;pointer-events:none} /* non-zero opacity keeps compositor & decoder warm behind v1 */
#starMask{position:absolute;z-index:2;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(20,17,14,.96) 0 48%,rgba(20,17,14,0) 74%);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#glass{position:absolute;z-index:2;left:30%;top:43%;width:34.5%;height:22%;border-radius:1.4% / 4%;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,#0f2d62,var(--screen));box-shadow:0 0 6cqw rgba(77,178,255,.35);transition:opacity .7s ease}
#glass.on{opacity:1}

/* plate is drawn at 908x200 and scaled onto the video plate by JS */
#plate{position:absolute;z-index:2;left:0;top:0;width:908px;height:200px;transform-origin:0 0;opacity:0;pointer-events:none;transition:opacity .5s ease;will-change:transform}
#plate.ready{opacity:1;pointer-events:auto}
#plate.shake #chars{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(7px)}}

#chars{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0;
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:156px;line-height:1;
  text-transform:uppercase;white-space:nowrap;pointer-events:none;
  gap:var(--gap,0px)}
#plate.engrave #chars{transition:none}

/* During Part 2 the plate is transformed on every frame. Live DOM text is
   re-rasterised as that transform changes, and on some machines that shows up
   as the glyphs tearing / ghosting / flickering mid-motion (the text is the one
   element whose raster the compositor keeps rebuilding). So once the engrave is
   finished we bake the number into a STATIC canvas — a fixed texture the
   compositor can just transform — and hide the live text. */
#numCanvas{position:absolute;left:0;top:0;width:908px;height:200px;display:none;pointer-events:none;
  transform:translateZ(0);backface-visibility:hidden;image-rendering:auto}
#plate.raster #numCanvas{display:block}
#plate.raster #chars{display:none}

.ch{display:inline-block;color:#101216;text-shadow:0 .05em .07em rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.25)}   /* static: no bobbing, so the number never moves on the plate */
.ch>i{display:inline-block;font-style:normal;animation:pop .32s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{from{opacity:0;transform:translateY(.25em) scale(.7)}to{opacity:1;transform:none}}

/* engrave: sink once, then stay put (transform:none) */
#plate.engrave .ch{animation:sink .55s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:calc(var(--i,0)*45ms)}
#plate.engrave .ch>i{animation:none;opacity:1;transform:none}
@keyframes sink{
  from{transform:translateY(-.09em) scale(1.06);color:#101216;text-shadow:0 .18em .2em rgba(0,0,0,.45)}
  to{transform:none;color:#191b20;text-shadow:0 .026em 0 rgba(255,255,255,.95),0 -.024em 0 rgba(0,0,0,.8),.03em .04em .05em rgba(0,0,0,.5)}}

#caret{position:relative;width:0;height:.78em;margin-left:calc(var(--gap,0px)*-1)}
#caret::after{content:"";position:absolute;left:.06em;top:0;width:.07em;height:100%;background:#14161b;animation:blink 1s steps(1) infinite}
#plate.engrave #caret{display:none!important}
@keyframes blink{50%{opacity:0}}

#phold{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;font:600 36px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(20,22,27,.42);pointer-events:none;white-space:nowrap}
#phold b{display:inline-block;width:3px;height:68px;background:#14161b;animation:blink 1s steps(1) infinite}
#plateInput{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;background:transparent;color:transparent;cursor:text;z-index:1}

/* arrow lives OUTSIDE the plate, as a sibling in #stage; JS positions it */
#go{position:absolute;z-index:3;border:0;border-radius:50%;background:#14161b;color:#fff;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.14);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .35s}
#go svg{width:48%;height:48%}
#go.show{opacity:1;pointer-events:auto}
#go.show:disabled{opacity:.28;cursor:not-allowed}
#go.live{animation:ring 1.7s ease-out infinite}
@keyframes ring{0%{box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 0 0 rgba(255,178,62,.8)}100%{box-shadow:0 4px 12px rgba(0,0,0,.4),0 0 0 14px rgba(255,178,62,0)}}
#go.gone{opacity:0!important;transform:scale(.4);pointer-events:none}

#glint{position:absolute;inset:-40% -6%;overflow:hidden;pointer-events:none;border-radius:4px}
#glint::after{content:"";position:absolute;top:0;bottom:0;left:-35%;width:26%;opacity:0;transform:skewX(-22deg);filter:blur(5px);mix-blend-mode:screen;
  background:linear-gradient(90deg,transparent,rgba(255,244,214,.95),transparent)}
#plate.glint-go #glint::after{animation:glint .75s ease-out forwards}
@keyframes glint{from{left:-35%;opacity:1}to{left:112%;opacity:1}}

#plateMsg{position:absolute;z-index:3;left:50%;transform:translateX(-50%);font-size:max(12px,1.15cqw);letter-spacing:.04em;color:#ffe9c4;
  text-shadow:0 1px 8px rgba(0,0,0,.8);background:rgba(10,8,6,.45);padding:.5em 1.1em;border-radius:99px;opacity:0;transition:opacity .4s;white-space:nowrap;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#plateMsg.show{opacity:1}
#plateMsg.bad{color:#ffb4b4}
#plateMsg kbd{font:inherit;padding:0 .4em;border:1px solid rgba(255,233,196,.5);border-radius:4px}

#hud{position:absolute;top:calc(14px + var(--sat));right:14px;z-index:5;display:flex;gap:8px}
#hud button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(10,8,6,.5);color:#fff;display:grid;place-items:center;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#hud svg{width:20px;height:20px}
#fatal{position:absolute;inset:0;z-index:7;display:grid;place-items:center;text-align:center;padding:24px;background:#120c09;color:#ffd9a8;line-height:1.6}
#fatal code{background:rgba(255,255,255,.1);padding:2px 6px;border-radius:4px}

/* ---- car screen (phone + OTP) ---- */
#screenUI{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .55s ease;}
#screenUI.on{opacity:1;pointer-events:auto}
#intro .dashbar{position:absolute;top:calc(14px + var(--sat));left:22px;right:70px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;color:#7fa2d8;text-transform:uppercase}
#intro .panel{width:min(480px,100%);padding:30px 28px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid rgba(120,170,255,.22);box-shadow:0 20px 70px rgba(0,0,0,.45),inset 0 0 40px rgba(77,178,255,.07)}
#intro .eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
#intro .miniplate{font:700 15px "Barlow Condensed",sans-serif;letter-spacing:.08em;color:#1a1c22;background:#eee9de;padding:3px 9px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
#intro .panel h2{margin:12px 0 6px;font-size:26px;letter-spacing:-.01em}
#intro .panel p{margin:0 0 18px;color:var(--mut);font-size:14px;line-height:1.55}
#intro .field{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.22);overflow:hidden;transition:border-color .2s,box-shadow .2s}
#intro .field:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,178,255,.2)}
#intro .field span{padding:0 12px 0 14px;color:var(--mut);font-weight:600;border-right:1px solid var(--line);height:52px;display:grid;place-items:center}
#intro .field input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--txt);font:600 20px Inter,sans-serif;letter-spacing:.06em;padding:0 14px;height:52px}
#intro .consent{display:flex;gap:10px;align-items:flex-start;margin:16px 0;font-size:12.5px;color:var(--mut);line-height:1.5}
#intro .consent input{margin-top:2px;accent-color:var(--amber)}
#intro .btn{width:100%;height:50px;border:0;border-radius:12px;font-weight:700;font-size:15px;color:#2a1500;background:linear-gradient(135deg,var(--amber),var(--amber2));transition:opacity .2s,transform .15s}
#intro .btn:hover:not(:disabled){transform:translateY(-1px)}
#intro .btn:disabled{opacity:.35;cursor:not-allowed}
#intro .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
#intro .err{min-height:20px;margin-top:10px;font-size:13px;color:#ffb4b4}
#intro .otps{display:flex;gap:9px;justify-content:space-between;margin-bottom:14px}
#intro .otps input{width:100%;min-width:0;height:56px;text-align:center;font:700 24px Inter,sans-serif;color:var(--txt);background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;outline:0}
#intro .otps input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,178,255,.2)}
#intro .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin-bottom:14px}
#intro .linkbtn{background:none;border:0;color:var(--blue);padding:0;font-size:13px}
#intro .linkbtn:disabled{color:var(--mut);cursor:default}
#intro .chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:rgba(255,178,62,.14);color:var(--amber);border:1px solid rgba(255,178,62,.3)}
#intro .ok-tick{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:rgba(49,208,160,.15);color:var(--ok);font-size:30px;border:1px solid rgba(49,208,160,.4)}

/* ================= SITE ================= */
#site{min-height:100vh;background:#FFFFFF;color:#202124;font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
::selection{background:#378FF5;color:#fff}

@media (prefers-reduced-motion:reduce){
  .ch,#go.live,#caret,#phold b{animation:none!important}
}
</style>

<!-- ================= INTRO: uses ONLY your two videos ================= -->
<div id="intro">
  <div id="stage">
    <video id="v1" playsinline preload="auto"></video>
    <video id="v2" muted playsinline preload="auto"></video>

      <div id="chars"></div>

      <div id="glint"></div>
      <input id="plateInput" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="14" aria-label="Vehicle registration number">
    </div>
    <button id="go" type="button" disabled aria-label="Confirm vehicle number">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>

  <div id="screenUI"></div>
</div>

/*
 * CANONICAL QUAD TABLES (TL,TR,BR,BL) — computed ONCE at load.
 *
 * The calibration detector returns the same four physical corners, but its
 * PCA axis has no inherent direction, so the raw point order per keyframe is
 * only defined up to a rotation/reflection (in the generated tables it was
 * consistently BR,BL,TL,TR).
 *
 * FIX (root cause of the flicker): the old code re-derived the corner order
 * PER FRAME with a min(x+y)/max(x+y)/max(x-y)/min(x-y) heuristic. That
 * heuristic is only valid while the plate is roughly axis-aligned; when the
 * plate becomes steeply foreshortened near the end of the shot the sums tie
 * up, two heuristics claim the same corner, the "degenerate" guard fires and
 * the RAW (rotated 180°) quad is used for that keyframe. Interpolating
 * between a correctly-ordered quad and a rotated one then swings/mirrors the
 * homography mid-motion, which is exactly the visible flicker/jump of the
 * engraved number.
 *
 * Instead, every tier table is canonicalized ONCE, in order, with TEMPORAL
 * CONTINUITY: frame 0 picks TL as the most top-left corner, and every
 * following keyframe chooses, among the 8 possible corner bijections
 * (4 rotations x 2 reflections), the one closest to the previous frame's
 * canonical corners. Consecutive keyframes move a few percent at most, so
 * the closest mapping is always the physically correct one, the corner
 * ordering can never flip between frames, and quadAt() can never interpolate
 * between incompatible quads. (Verified: 0 wrong assignments across all
 * three tier tables, including the t=1.3 frame that broke the heuristic.)
 */
function canonicalizeTable(KF){
  const PERMS=[];
  for(let o=0;o<4;o++){
    PERMS.push([0,1,2,3].map(i=>(i+o)%4));   // cyclic rotations
    PERMS.push([0,3,2,1].map(i=>(i+o)%4));   // reversed winding
  }
  const out=[]; let prev=null;
  for(const row of KF){
    const pts=[[row[1],row[2]],[row[3],row[4]],[row[5],row[6]],[row[7],row[8]]];
    const S=pts.map(p=>p[0]+p[1]), D=pts.map(p=>p[0]-p[1]);
    const minS=Math.min(...S), maxS=Math.max(...S), minD=Math.min(...D), maxD=Math.max(...D);
    let best=null,bestScore=Infinity;
    for(const perm of PERMS){
      const c=perm.map(i=>pts[i]);
      let score;
      if(!prev){
        /* First frame only (the plate is roughly axis-aligned at t=0): seed with a
           fully geometric order so the winding is correct — TL=min(x+y),
           BR=max(x+y), TR=max(x-y), BL=min(x-y) — and reject mirrored windings by
           requiring the same (positive) signed area as the design rectangle. */
        const area=(c[0][0]*c[1][1]-c[1][0]*c[0][1])+(c[1][0]*c[2][1]-c[2][0]*c[1][1])
                  +(c[2][0]*c[3][1]-c[3][0]*c[2][1])+(c[3][0]*c[0][1]-c[0][0]*c[3][1]);
        score=(c[0][0]+c[0][1]-minS)+(maxS-(c[2][0]+c[2][1]))
             +(maxD-(c[1][0]-c[1][1]))+((c[3][0]-c[3][1])-minD);
        if(area<=0) score+=1e6;
      }else{
        score=0;
        for(let k=0;k<4;k++) score+=(c[k][0]-prev[k][0])**2+(c[k][1]-prev[k][1])**2;
      }
      if(score<bestScore){bestScore=score;best=c;}
    }
    prev=best;
    out.push([row[0],best[0][0],best[0][1],best[1][0],best[1][1],best[2][0],best[2][1],best[3][0],best[3][1]]);
  }
  return out;
}

/*
 * TEMPORAL DENOISE of a quad table.
 *
 * The plate is a rigid object filmed by a smoothly-moving camera, so its true
 * corner track is smooth; but every keyframe here is an INDEPENDENT per-frame
 * measurement, so each carries a little detection noise (~0.2-0.4% of frame
 * width). Played back, that noise makes the overlay shimmer/wobble by a few
 * pixels frame-to-frame even though the ordering is correct — the "flicker"
 * that survives the ordering fix.
 *
 * This is NOT the forbidden "smoothing to hide a bug": the bug (corner-order
 * flips) is already fixed; this only removes zero-mean measurement noise from
 * the calibration data itself. A symmetric 5-tap binomial filter is used, so
 * any locally-linear motion (a corner moving at constant speed) passes through
 * unchanged — only the frame-to-frame jitter is attenuated. Endpoints are left
 * untouched so the first/last frames keep their measured values.
 */
function smoothTable(KF){
  if(KF.length<5) return KF;
  let cur=KF.map(r=>r.slice());
  /* TWO passes of the symmetric 5-tap kernel (an effective 9-tap): each pass
     removes ~half of the zero-mean per-frame detection noise, and because the
     kernel is symmetric a corner moving at a locally-constant velocity comes
     through unchanged. One pass left a few percent of visible shimmer; two
     passes drops it below the eye's threshold while still following the plate's
     real acceleration at the start/end of the shot. */
  for(let pass=0; pass<3; pass++){
    const src=cur.map(r=>r.slice());
    for(let i=2;i<src.length-2;i++){
      for(let j=1;j<=8;j++){
        cur[i][j]=(src[i-2][j]+2*src[i-1][j]+3*src[i][j]+2*src[i+1][j]+src[i+2][j])/9;
      }
    }
  }
  return cur;
}
/*
 * PLATE SIZE CORRECTION.
 *
 * The detector fits the plate's BRIGHT blob contour, which sits a little inside
 * the plate's white face — measured at ~9% in width and ~2% in height on this
 * footage. Because the engraved number is sized to the quad, that made the
 * number come out slightly small with a white margin around it. So every quad
 * (and P1) is grown about its own centre by these factors, which makes the
 * number fill the plate. Tune PLATE_GROW_X/Y if it still looks off.

function expandQuad(KF){
  return KF.map(row=>{
    const cx=(row[1]+row[3]+row[5]+row[7])/4, cy=(row[2]+row[4]+row[6]+row[8])/4;
    const o=row.slice();
    for(let j=1;j<=7;j+=2){ o[j]=cx+(row[j]-cx)*PLATE_GROW_X; o[j+1]=cy+(row[j+1]-cy)*PLATE_GROW_Y; }

    o[3]=trx+(trx-tlx)*RIGHT_EXT; o[4]=ty+(ty-tly)*RIGHT_EXT;
    o[5]=brx+(brx-blx)*RIGHT_EXT; o[6]=bry+(bry-bly)*RIGHT_EXT;
    return o;
  });
}

  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  return {x:cx-(cx-b.x)*PLATE_GROW_X, y:cy-(cy-b.y)*PLATE_GROW_Y, w:b.w*PLATE_GROW_X, h:b.h*PLATE_GROW_Y};
}

  '4k':expandQuad(smoothTable(canonicalizeTable(QUAD_KF4K))),
  '1080':expandQuad(smoothTable(canonicalizeTable(QUAD_KF1080))),

/*
 * OPTIONAL DENSE TABLES (tracks.js, produced by write_tracks.py)
 *
 * write_tracks.py measures the real plate on every frame of each encode and
 * emits TRACKS = { "": {P1, QUAD}, "_1080": {...}, "_4k": {...} } with rows
 * [t, TLx,TLy, TRx,TRy, BRx,BRy, BLx,BLy] (normalized) and P1 = {x,y,w,h}.
 * If the file is present we adopt it per loaded tier; if it is absent the
 * embedded canonical tables above are used, so the page always works.
 * The generated rows are canonicalized once here too, so a detector whose
 * point order is rotated/reflected can never reintroduce the flicker.
 */
const TRACKS_BY_TIER={};
const activeTracks = (typeof window !== 'undefined' && window.TRACKS) || (typeof TRACKS !== 'undefined' ? TRACKS : null);
if(activeTracks){
  for(const key in activeTracks){
    const entry=activeTracks[key];
    if(!entry||!entry.QUAD||!entry.QUAD.length) continue;
    const canon=expandQuad(smoothTable(canonicalizeTable(entry.QUAD)));
    const name=key==='_4k'?'4k':key==='_1080'?'1080':'360';
    TRACKS_BY_TIER[name]={P1:entry.P1||null,QUAD:canon};
    if(name==='360') TRACKS_BY_TIER['']={P1:entry.P1||null,QUAD:canon};
  }
  /* write_tracks.py drops the last, edge-on frames where the plate can no longer
     be detected, so a generated tier can end a few frames early. If so, append
     the embedded tail for that tier (they agree where they overlap), otherwise
     the overlay would FREEZE at the last keyframe while the real plate keeps
     moving — a visible detach right before the plate leaves. */
  for(const name in TRACKS_BY_TIER){
    const emb=QUAD_BY_TIER[name]; if(!emb||!emb.length) continue;
    const tbl=TRACKS_BY_TIER[name].QUAD;
    const last=tbl.length?tbl[tbl.length-1][0]:0;
    for(const row of emb){ if(row[0]>last+1e-6) tbl.push(row.slice()); }
  }
}
const tierNameOf=s=>s==='_4k'?'4k':s==='_1080'?'1080':'360';

// Mechanical plate stamp punch sound
function playStampSound(){
  if(!state.sound) return;
  const ctx=getAudioCtx(); if(!ctx) return;
  const now=ctx.currentTime;
  
  // 1. Heavy hydraulic punch (low frequency thud)
  const osc=ctx.createOscillator(), oscGain=ctx.createGain();
  osc.type='triangle';
  osc.frequency.setValueAtTime(150,now);
  osc.frequency.exponentialRampToValueAtTime(32,now+0.18);
  oscGain.gain.setValueAtTime(0.75,now);
  oscGain.gain.exponentialRampToValueAtTime(0.001,now+0.22);
  osc.connect(oscGain); oscGain.connect(ctx.destination);
  osc.start(now); osc.stop(now+0.25);
  
  // 2. Metal resonance clank
  const metal=ctx.createOscillator(), metalGain=ctx.createGain();
  metal.type='sine';
  metal.frequency.setValueAtTime(580,now);
  metal.frequency.exponentialRampToValueAtTime(280,now+0.15);
  metalGain.gain.setValueAtTime(0.35,now);
  metalGain.gain.exponentialRampToValueAtTime(0.001,now+0.18);
  metal.connect(metalGain); metalGain.connect(ctx.destination);
  metal.start(now); metal.stop(now+0.2);

  // 3. Impact transient noise
  const bufferSize=Math.floor(ctx.sampleRate*0.06);
  const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.015));
  const noise=ctx.createBufferSource(); noise.buffer=buffer;
  const noiseFilter=ctx.createBiquadFilter(); noiseFilter.type='bandpass'; noiseFilter.frequency.value=1200;
  const noiseGain=ctx.createGain(); noiseGain.gain.setValueAtTime(0.5,now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001,now+0.06);
  noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(ctx.destination);
  noise.start(now);
}

/* Solve the projective transform from the 908x200 design plate to the
   measured four-corner quadrilateral. This is what keeps every character
   locked to the physical plate even while the camera changes perspective. */
function solveHomography(src,dst){
  const A=[], b=[];
  for(let i=0;i<4;i++){
    const x=src[i][0], y=src[i][1], X=dst[i][0], Y=dst[i][1];
    A.push([x,y,1,0,0,0,-x*X,-y*X]); b.push(X);
    A.push([0,0,0,x,y,1,-x*Y,-y*Y]); b.push(Y);
  }
  for(let c=0;c<8;c++){
    let p=c;
    for(let r=c+1;r<8;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    if(Math.abs(A[p][c])<1e-12) return null;
    [A[c],A[p]]=[A[p],A[c]]; [b[c],b[p]]=[b[p],b[c]];
    const d=A[c][c];
    for(let j=c;j<8;j++) A[c][j]/=d; b[c]/=d;
    for(let r=0;r<8;r++){
      if(r===c) continue;
      const f=A[r][c]; if(Math.abs(f)<1e-14) continue;
      for(let j=c;j<8;j++) A[r][j]-=f*A[c][j]; b[r]-=f*b[c];
    }
  }
  return [b[0],b[1],b[2],b[3],b[4],b[5],b[6],b[7],1];
}

      if(i>=tiers.length){ el.onloadeddata=el.onloadedmetadata=el.onerror=null; return res(false); }
      const suffix=tiers[i++];
      let settled=false;

function quadAt(t){
  // Dense per-frame table for the tier that actually loaded (tracks.js), or the
  // embedded canonical table for that tier. Both are already TL,TR,BR,BL, so we
  // only ever interpolate between matching corners — no ordering flip possible.
  const KF=(v2._t2&&v2._t2.QUAD)||tierTable(v2Tier);
  if(!KF.length || t<KF[0][0] || t>KF[KF.length-1][0]) return null;

  if(t<=KF[0][0]){
    return KF[0].slice(1);
  }
  let i=0;
  while(i<KF.length-2 && t>KF[i+1][0]) i++;
  const a=KF[i], b=KF[i+1];
  const u=Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0])));
  const out=[];
  for(let j=1;j<=8;j++) out.push(a[j]+(b[j]-a[j])*u);
  return out;   // flat 8: TLx,TLy,TRx,TRy,BRx,BRy,BLx,BLy — matches setQuad/clipQuad
}
function quadBounds(q){
  const xs=[q[0],q[2],q[4],q[6]], ys=[q[1],q[3],q[5],q[7]];
  return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
}
function clipQuad(q){
  const over=Math.max(q[1],q[3],q[5],q[7])-1;
  plate.style.clipPath=over>0?'inset(0 0 '+Math.min(100,over*100)+'% 0)':'none';
}
function starAt(t){
  if(t<STAR[0][0]) return null;
  if(t>=STAR[STAR.length-1][0]) return STAR[STAR.length-1];
  let i=0; while(i<STAR.length-2 && t>STAR[i+1][0]) i++;
  const a=STAR[i], b=STAR[i+1], u=(t-a[0])/(b[0]-a[0]), L=(p,q)=>p+(q-p)*u;
  return [t,L(a[1],b[1]),L(a[2],b[2]),L(a[3],b[3])];
}
function placeStar(s){
  if(!s){ star.style.opacity=0; return; }
  const d=s[3]; star.style.opacity=1;
  Object.assign(star.style,{left:(s[1]-d/2)*100+'%',top:(s[2]-d*8/9)*100+'%',width:d*100+'%',height:d*16/9*100+'%'});
}
/* Bake the engraved number into a static canvas (see the #numCanvas note in the
   CSS). Same font/size/gap the live text used, so the look is preserved; the
   only difference is that from here on the number is a fixed texture, which
   stops the per-frame re-rasterisation that was tearing the glyphs. */
function rasterizeNumber(){
  try{
    const txt=state.plate; if(!txt||!numCanvas) return false;
    const cv=numCanvas, S=cv.width/908, c=cv.getContext('2d'); if(!c) return false;
    c.setTransform(1,0,0,1,0,0); c.clearRect(0,0,cv.width,cv.height); c.scale(S,S);
    const cs=getComputedStyle(chars);
    const fs=parseFloat(cs.fontSize)||156, gap=parseFloat(cs.gap)||0;
    c.font='700 '+fs+'px '+cs.fontFamily;
    c.textAlign='center'; c.textBaseline='middle';
    const ws=[...txt].map(ch=>c.measureText(ch).width);
    const total=ws.reduce((a,b)=>a+b,0)+gap*Math.max(0,txt.length-1);
    let x=(908-total)/2+NUM_SHIFT_X;             // same centring nudge as the live text
    const y0=100+NUM_SHIFT_Y;
    if(NUM_SOFTEN>0){ try{ c.filter='blur('+NUM_SOFTEN+'px)'; }catch(_){} }
    for(let i=0;i<txt.length;i++){
      const cxp=x+ws[i]/2;
      c.save();
      c.shadowColor='rgba(0,0,0,.5)';
      c.shadowBlur=fs*.05*S;
      c.shadowOffsetX=fs*.03*S;
      c.shadowOffsetY=fs*.04*S;
      c.fillStyle='#191b20';
      c.fillText(txt[i],cxp,y0);
      c.restore();
      c.fillStyle='rgba(0,0,0,.8)';
      c.fillText(txt[i],cxp,y0-fs*.024);
      c.fillStyle='rgba(255,255,255,.95)';
      c.fillText(txt[i],cxp,y0+fs*.026);
      c.fillStyle='#191b20';
      c.fillText(txt[i],cxp,y0);
      x+=ws[i]+gap;
    }
    if(NUM_SOFTEN>0){ try{ c.filter='none'; }catch(_){} }
    return true;
  }catch(_){ return false; }
}

async function startDrive(){
  state.stage='drive';
  if(rasterizeNumber()) plate.classList.add('raster');   // freeze the number into a static texture (falls back to live text if unavailable)
  if(v2WarmP){ try{ await Promise.race([v2WarmP, wait(600)]); }catch(_){} }
  await ensureV2Ready(false);
  v2.muted=true;
  if(v2.currentTime>0.05){ try{ v2.currentTime=0; }catch(_){} }
  playCarSound();
  const q0=quadAt(0);
  if(q0) lastQuad=q0.slice();               // resize safety: remember the drive quad before any paint

  v2.style.transition='none';                 // kill any opacity transition on the video: the cut must be instantaneous
  plate.style.transition='none';               // no transition of any kind on the overlay while it is tracking

  // Make v2 visible and hide v1 before/during playback so the compositor renders every frame from t=0
  v1.pause();
  v1.style.visibility='hidden';
  v2.style.zIndex='1';
  v2.style.opacity='1';
  if(q0) setQuad(q0);

  let played=false;
  try{
    await v2.play();
    played=true;
  }catch(_){
    // Release v1 hardware decoder and fall back to base part2.mp4 if needed
    try{ v1.removeAttribute('src'); v1.load(); }catch(e){}
    const okBase=await ensureV2Ready(true);
    if(okBase){
      const qb=quadAt(0);
      if(qb){ lastQuad=qb.slice(); setQuad(qb); }
      try{ await v2.play(); played=true; }catch(e2){}
    }
  }
  if(!played) return afterDrive();

  let lastMediaTime=0;
  let rvfcTime=0;

  const draw=t=>{
    if(!Number.isFinite(t)) t=v2.currentTime||0;
    if(t < lastMediaTime - 0.08) return;       // stale/stuttering callback: keep the last applied quad
    if(t > lastMediaTime) lastMediaTime=t;

    const q=quadAt(t)||(t<PLATE_HIDE_AT&&lastQuad?lastQuad:null);
    if(q && t<PLATE_HIDE_AT){
      setQuad(q);
      clipQuad(q);
      plate.style.opacity=1;
    }else if(q && t<PLATE_HIDE_AT+0.14){
      setQuad(q);
      clipQuad(q);
      plate.style.opacity=Math.max(0,1-(t-PLATE_HIDE_AT)/0.14);
    }else{
      plate.style.opacity=0;
      plate.style.clipPath='none';
    }
    placeStar(starAt(t));
  };

  const useRvfc='requestVideoFrameCallback' in v2;
  if(useRvfc){
    const onFrame=(now,meta)=>{
      if(state.stage!=='drive') return;
      draw(meta.mediaTime);
      v2.requestVideoFrameCallback(onFrame);
    };
    v2.requestVideoFrameCallback(onFrame);
  }

  const startWall=performance.now();
  const rafTick=()=>{
    if(state.stage!=='drive') return;
    if(v2.paused && !v2.ended && performance.now()-startWall<3500){
      v2.play().catch(()=>{});
    }
    const t=Math.max(lastMediaTime, rvfcTime, v2.currentTime||0);
    if(!useRvfc) draw(t);
    if(t>=STOP || v2.ended || performance.now()-startWall>5500){
      v2.pause();
      return afterDrive();
    }
    requestAnimationFrame(rafTick);
  };
  requestAnimationFrame(rafTick);
}

/* ---------- zoom into the infotainment screen ---------- */
async function afterDrive(){
  stopCarSound();
  if(state.stage==='zoom'||state.stage==='screen') return;
  state.stage='zoom'; lastQuad=null; plate.style.opacity=0; plate.style.clipPath='none'; placeStar(STAR[STAR.length-1]);
  const st=stage.getBoundingClientRect(), vw=innerWidth, vh=innerHeight;
  const ox=(SCREEN.x+SCREEN.w/2)*st.width, oy=(SCREEN.y+SCREEN.h/2)*st.height;
  const cx=st.left+ox, cy=st.top+oy;
  const s=Math.max(1.5, vw/(SCREEN.w*st.width), vh/(SCREEN.h*st.height));
  stage.style.transformOrigin=ox+'px '+oy+'px';
  requestAnimationFrame(()=>{ stage.style.transform='translate('+(vw/2-cx)+'px,'+(vh/2-cy)+'px) scale('+s+')'; });

  await wait(1500);
  openScreen();
}
function openScreen(){
  state.stage='screen';
  window.__INITIAL_PLATE__=state.plate;
  $('#site').hidden=false;
  document.body.classList.remove('intro-on');
  scrollTo(0,0);
  window.dispatchEvent(new CustomEvent('insuredrive:open',{detail:{plate:state.plate,mobile:state.phone}}));
  requestAnimationFrame(()=>{
    intro.classList.add('out');
    setTimeout(()=>{ v1.pause(); v2.pause(); intro.remove(); },800);
  });
}
if(/[?&]autostart=1/.test(location.search)){
  state.plate='WB02AB1234';
  setTimeout(openScreen,50);
}
const tickClock=()=>{ if($('#clk')) $('#clk').textContent=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}); };
tickClock(); setInterval(tickClock,30000);
})();
</script>
